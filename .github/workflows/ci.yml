name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `prisma.config.ts` throws when DATABASE_URL is unset, and `npm run build` runs
# `prisma generate` first. Neither `validate` nor `generate` opens a connection, so a
# syntactically valid placeholder is enough — CI never touches a real database.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  verify:
    name: Test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
